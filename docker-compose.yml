# Local development database — start manually with: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: nova-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nova
    ports:
      - '5432:5432'
    volumes:
      - nova-db-data:/var/lib/postgresql/data

volumes:
  nova-db-data:
